services:
  mysql:
    image: mysql:8.0
    container_name: learning-growth-mysql
    env_file:
      - ./backend/.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} -D $${MYSQL_DATABASE} -e 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis/redis-stack:latest
    container_name: learning-growth-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: learning-growth-backend
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      DATA_DIR: /app/data
      RAW_DATA_DIR: /app/data/raw
      PROCESSED_DATA_DIR: /app/data/processed
      OCR_DATA_DIR: /app/data/ocr
      LOCAL_IMPORT_ROOT: /app/data
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
    name: learning-growth-mysql-data
  redis_data:
    name: learning-growth-redis-data
